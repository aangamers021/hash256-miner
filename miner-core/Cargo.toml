[package]
name = "hash256-miner-core"
version = "0.1.0"
edition = "2021"
description = "Rust mining core (CPU + OpenCL GPU) for hash256-miner — driven via JSON-lines IPC from the Go orchestrator"
license = "MIT"

[[bin]]
name = "hash256-miner-core"
path = "src/main.rs"

[dependencies]
sha3 = "0.10"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
thiserror = "1"
crossbeam-channel = "0.5"
ocl = { version = "0.19", optional = true }

[features]
default = []
gpu = ["dep:ocl"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
